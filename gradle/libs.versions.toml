[versions]
#plugins
agp = "9.3.0"

#libraries
coreKtx = "1.19.0"
appcompat = "1.7.1"
kotlinReflect = "2.3.21"
lifecycleRuntimeKtx = "2.11.0"
lifecycleViewnodelKtxVersion = "2.11.0"
lifecycleLivedataKtx = "2.11.0"
lifecycleViewmodelSavedstate = "2.11.0"
material = "1.14.0"
constraintLayout = "2.2.1"
junit = "4.13.2"
androidxJunit = "1.3.0"
kotlinxCoroutinesTest = "1.11.0"
espressoCore = "3.7.0"
activityVersion = "1.13.0"
#androidUtilities="LOCAL"
#androidBinding = "LOCAL"
androidLogger = "2.2.3"
androidUtilities="4.16.3"
androidBinding = "1.15.3"
androidViewex = "1.2.1"

[libraries]
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlinReflect" }
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintLayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
lifecycleLiveDataKtx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
lifecycleViewModelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleViewnodelKtxVersion" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
lifecycleViewModelSavedState = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycleViewmodelSavedstate" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
androidxJunit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
android-logger = { module = "com.github.toyota-m2k:android-logger", version.ref = "androidLogger" }
android-utilities = { module = "com.github.toyota-m2k:android-utilities", version.ref = "androidUtilities" }
android-binding = { module = "com.github.toyota-m2k:android-binding", version.ref = "androidBinding" }
android-viewex = { module = "com.github.toyota-m2k:android-viewex", version.ref = "androidViewex" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activityVersion" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
